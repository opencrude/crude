<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <meta http-equiv="refresh" content="0; url=https://opencrude.github.io/crude/" />
  <link rel="canonical" href="https://opencrude.github.io/crude/" />
  <link rel="icon" href="https://opencrude.github.io/crude/favicon.svg" type="image/svg+xml" />
  <title>Page not found — Crude</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d1117;
      --foreground: #e6edf3;
      --muted-foreground: #9aa4b2;
      --primary: #f0883e;
      --primary-foreground: #15100b;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: var(--background);
      color: var(--foreground);
      font-family: "Geist", "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 28rem; padding: 2rem; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
      color: var(--foreground);
      font-family: ui-monospace, "SFMono-Regular", monospace;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-decoration: none;
    }
    .mark {
      display: grid;
      width: 2.25rem;
      height: 2.25rem;
      place-items: center;
      border: 1px solid color-mix(in oklab, var(--primary) 45%, transparent);
      border-radius: 0.6rem;
      background: color-mix(in oklab, var(--primary) 12%, transparent);
      color: var(--primary);
    }
    h1 { margin: 0 0 0.75rem; font-size: 2rem; letter-spacing: -0.03em; }
    p { margin: 0 0 1.5rem; color: var(--muted-foreground); line-height: 1.7; }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.5rem;
      padding: 0.55rem 1.1rem;
      border-radius: 0.5rem;
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="https://opencrude.github.io/crude/">
      <span class="mark" aria-hidden="true">&gt;_</span>
      CRUDE
    </a>
    <h1>That path does not exist.</h1>
    <p>The page may have moved, or the link may be wrong. Taking you back to the Crude website.</p>
    <a class="button" href="https://opencrude.github.io/crude/">Back to Crude</a>
  </main>
  <script>
    window.location.replace("https://opencrude.github.io/crude/");
  </script>
</body>
</html>
