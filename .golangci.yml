# Phase 15 lint gate — scoped to app/TUI/workspace packages in CI.
# Full-repo cleanup is tracked separately; noisy linters stay off until green.
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
  disable:
    # Pre-existing dead code / unchecked errors — enable when repo is clean.
    - errcheck
    - gosimple
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test-only branches and assignments are lower signal for the Phase 15 gate.
    - path: _test\.go
      linters:
        - ineffassign
        - staticcheck
    # Legacy session-settings trim cutset — unrelated to TUI stabilization.
    - path: tui/screens/sessionsettings/
      linters:
        - staticcheck
      text: "SA1024"
    # Shell status readiness dot assignments are mid-migration.
    - path: tui/screens/shellstatus/status\.go
      linters:
        - ineffassign
    # Launcher layout guard uses Empty() for readability during migration.
    - path: tui/screens/launcher/launcher\.go
      linters:
        - staticcheck
      text: "SA4017"
    # TextField selection swap is intentionally incomplete during theme migration.
    - path: tui/ui/textfield\.go
      linters:
        - staticcheck
      text: "SA4006"
    - path: tui/ui/textfield\.go
      linters:
        - staticcheck
      text: "SA9003"
    - path: tui/ui/list_test\.go
      linters:
        - staticcheck
      text: "SA4017"
    - path: workspace/
      linters:
        - errcheck
