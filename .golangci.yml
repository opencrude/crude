version: "2"
run:
  tests: true
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - errcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - ineffassign
          - staticcheck
        path: _test\.go
      - linters:
          - staticcheck
        path: tui/screens/sessionsettings/
        text: SA1024
      - linters:
          - ineffassign
        path: tui/screens/shellstatus/status\.go
      - linters:
          - staticcheck
        path: tui/screens/launcher/launcher\.go
        text: SA4017
      - linters:
          - staticcheck
        path: tui/ui/textfield\.go
        text: SA4006
      - linters:
          - staticcheck
        path: tui/ui/textfield\.go
        text: SA9003
      - linters:
          - staticcheck
        path: tui/ui/list_test\.go
        text: SA4017
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
