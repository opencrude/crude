name: Release

# Command-only build: dispatch with the immutable tag selected as ref.
# Pushes, pull requests and tags never start this workflow automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-prerelease] tag to build as a draft
        required: true
        type: string
      mode:
        description: verified runs the full chain; instant deliberately skips full verification
        required: true
        default: verified
        type: choice
        options:
          - verified
          - instant

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            verified|instant) ;;
            *) echo "release: unknown mode '$RELEASE_MODE'" >&2; exit 1 ;;
          esac
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); from release import validate_version; validate_version(os.environ["RELEASE_TAG"])'
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          # Reusable verification runs on this workflow's commit. Never package
          # a different tag while presenting checks for the selected branch.
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/master
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    if: ${{ inputs.mode == 'verified' }}
    uses: ./.github/workflows/verify.yml
  build:
    needs: [source, verify]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.verify.result == 'success' || (inputs.mode == 'instant' && needs.verify.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux
          - runner: windows-2022
            target: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Record release mode
        run: |
          echo "release mode: ${{ inputs.mode }} (verify: ${{ needs.verify.result }})"
      - name: Install pinned Go dependency notice collector
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Build Linux release
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: . scripts/libghostty_env.sh && python scripts/release.py build --version "$RELEASE_TAG"
      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          . ./scripts/libghostty_env.ps1
          python scripts/release.py build --version $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
      - name: Smoke-test actual Windows install/update
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          Copy-Item "dist/crude_${env:RELEASE_TAG}_windows_amd64.zip.sha256" dist/SHA256SUMS
          # Child process: the fixture's explicit exit must not skip cleanup or
          # let a later Remove-Item mask its native failure code.
          pwsh -NoLogo -NoProfile -NonInteractive -File ./scripts/test_install.ps1 -ReleaseDir dist -ReleaseVersion $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'native release installer smoke failed' }
          Remove-Item dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [source, build]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify inventory and smoke-test actual Linux install/update
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python scripts/release.py combine --version "$RELEASE_TAG"
          python scripts/test_install.py --release-dir dist --release-version "$RELEASE_TAG"
      - name: Create a draft only (never auto-publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          title="Crude $RELEASE_TAG"
          if [[ "$RELEASE_MODE" == "instant" ]]; then title="$title (instant)"; fi
          # Existing releases deliberately fail; no --clobber or overwrite.
          gh release create "$RELEASE_TAG" \
            "dist/crude_${RELEASE_TAG}_linux_amd64.tar.gz" \
            "dist/crude_${RELEASE_TAG}_windows_amd64.zip" dist/SHA256SUMS \
            install.sh install.ps1 install.bat \
            --verify-tag --draft --title "$title" --generate-notes "${flags[@]}"
          if [[ "$RELEASE_MODE" == "instant" ]]; then
            notes="$RUNNER_TEMP/instant-notes.md"
            gh release view "$RELEASE_TAG" --json body --jq .body > "$notes"
            {
              printf '\n\n---\n'
              printf '%s\n' '**Instant release.** This build deliberately skipped the full verification chain: full-repository lint, design/documentation/performance gates, the full test and race suites, and the Windows test suite. Source identity, native packaging, installer checks and the release inventory were still verified. Treat this draft as an unreviewed build until you inspect it and publish deliberately.'
            } >> "$notes"
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          fi
