name: Native preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Linux release regression cases
        if: runner.os == 'Linux'
        env:
          CASES: '^Test(CheckDirectoryNoSymlinks|MigrateFailureDoesNotLeavePartialSchema|TerminalRetryUsesPublishedOwnerBeforeRunLoopStarts|RootStopDuringFailedTerminalSettlementRetriesOnlyPersistence|RecentRefreshPreservesQuerySelectionViewportAndFocus|ConnectedShellControlTreeRevealFilterAndPaint|DocumentWatchRemovedDirectoryReleasesAndReopens|TerminalOperationsDoNotWaitBehindDocumentLane)$'
        run: |
          . scripts/libghostty_env.sh
          go test -p 2 ./fileio ./sessiondb ./session ./tui/screens/launcher ./tui/viewmodel ./workspace ./core -run "$CASES" -count=3 -timeout=90s
      - name: Windows release regression cases
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CASES: '^Test(CheckDirectoryNoSymlinks|WindowsShortDirectory|DocumentServiceWindowsShortPath|CanonicalConversationSnapshotRoundTripsEveryField|MigrateFailureDoesNotLeavePartialSchema|TerminalRetryUsesPublishedOwnerBeforeRunLoopStarts|RootStopDuringFailedTerminalSettlementRetriesOnlyPersistence|RecentRefreshPreservesQuerySelectionViewportAndFocus|ConnectedShellControlTreeRevealFilterAndPaint|DocumentWatchRemovedDirectoryReleasesAndReopens|TerminalOperationsDoNotWaitBehindDocumentLane|DetachedCorePTYInterruptsNativeForegroundCommand|SettingsMixedScopesExplicitChoicesRestartAndRepair)$'
        run: |
          . ./scripts/libghostty_env.ps1
          go test -p 2 ./fileio ./sessiondb ./session ./tui/screens/launcher ./tui/viewmodel ./workspace ./core ./app -run $env:CASES -count=3 -timeout=90s
          if ($LASTEXITCODE -ne 0) { throw 'native release regressions failed' }
      - name: Windows PowerShell 5.1 installers
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install.ps1
      - name: PowerShell 7 installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install.ps1
