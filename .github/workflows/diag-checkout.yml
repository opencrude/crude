name: Diagnose native checkout

# Temporary diagnostic: report what the native bootstrap leaves dirty.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Report tree state (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          git config --get core.autocrlf || true
          echo "--- status ---"
          git status --porcelain
          echo "--- eol mismatches ---"
          git ls-files --eol | grep -v 'i/lf *w/lf' || true
          echo "--- ignored (first 40) ---"
          git status --porcelain --ignored | head -40
      - name: Report tree state (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --get core.autocrlf
          Write-Host '--- status ---'
          git status --porcelain
          Write-Host '--- eol mismatches ---'
          git ls-files --eol | Select-String -NotMatch 'i/lf *w/lf'
          Write-Host '--- ignored (first 40) ---'
          git status --porcelain --ignored | Select-Object -First 40
