name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux quality and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Install pinned validation tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install golang.org/x/tools/gopls@v0.22.0
      - name: Workflow and installer checks
        run: |
          actionlint
          bash -n install.sh
          sh -n site/linux.sh
          shellcheck -x install.sh site/linux.sh scripts/bootstrap_libghostty.sh
          python scripts/test_install.py -v
          python -m unittest discover -s scripts -p test_release.py -v
          python -m unittest discover -s scripts -p test_go_test.py -v
          python -m unittest discover -s scripts -p protocol_fuzz_test.py -v
      - name: Lint (full repo)
        run: . scripts/libghostty_env.sh && golangci-lint run ./...
      - name: Design, documentation and performance gates
        run: make design-audit docs-check bench-gate
        env:
          BENCH_EVIDENCE: ${{ runner.temp }}/crude-benchmarks.txt
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ github.sha }}-linux-amd64
          path: ${{ runner.temp }}/crude-benchmarks.txt
          retention-days: 90
          if-no-files-found: ignore
      - name: Build
        run: make build
      - name: Full test suite
        run: . scripts/libghostty_env.sh && python scripts/test_go.py
      - name: Native syntax and binding ownership
        run: make test-syntax
      - name: Neutral contracts and LSP process ownership
        run: make test-lsp
      - name: Full race suite
        run: . scripts/libghostty_env.sh && python scripts/test_go.py --race
      - name: Bounded native protocol fuzz campaigns
        env:
          CRUDE_TEMP_DIR: ${{ runner.temp }}
          GOMAXPROCS: '2'
        run: bash scripts/protocol_fuzz.sh
  windows:
    name: Windows native build and tests
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
      - name: Windows capture driver checks
        shell: pwsh
        run: ./scripts/test_tuishot.ps1
      - name: Windows regression preflight
        shell: pwsh
        run: |
          . ./scripts/libghostty_env.ps1
          go test ./workspace/fileio ./agent/skills ./workspace ./core ./app ./agent/sessiondb -count=1 -timeout=90s -run 'Test(CheckDirectoryNoSymlinks|WindowsShortDirectory|WindowsShortPath|DocumentServiceWindowsShortPath|CanonicalConversationSnapshotRoundTripsEveryField|CreateDoesNotOverwriteAuthoredWork|ControlExecutionSelectionExactSessionAndRevision|TerminalOperationsDoNotWaitBehindDocumentLane|DetachedCorePTYInterruptsNativeForegroundCommand|ConPTYStandardConsoleHandles|ConPTYNaturalExitDrainsFinalOutputBeforePublishingExit|WindowsInteractiveConsoleStreamsAreCaptured|SettingsMixedScopesExplicitChoicesRestartAndRepair)$'
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression preflight failed' }
      - name: Native build
        shell: pwsh
        run: |
          . ./scripts/libghostty_env.ps1
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
      - name: Full native test suite
        shell: pwsh
        run: |
          . ./scripts/libghostty_env.ps1
          python scripts/test_go.py
          if ($LASTEXITCODE -ne 0) { throw 'full Go test suite failed' }
      - name: Native parser binding regression suite
        shell: pwsh
        run: |
          . ./scripts/libghostty_env.ps1
          Push-Location third_party/go-tree-sitter
          try {
            go test . -count=1 -timeout=180s
            if ($LASTEXITCODE -ne 0) { throw 'native parser binding tests failed' }
          } finally {
            Pop-Location
          }
      - name: Native language-server process ownership
        shell: pwsh
        run: |
          Push-Location third_party/powernap
          try {
            go test ./pkg/lsp ./pkg/transport -count=1 -timeout=90s
            if ($LASTEXITCODE -ne 0) { throw 'native language-server ownership tests failed' }
          } finally {
            Pop-Location
          }
      - name: Windows PowerShell 5.1 installer fixtures
        shell: powershell
        run: ./scripts/test_install.ps1
      - name: PowerShell 7 installer fixtures
        shell: pwsh
        run: ./scripts/test_install.ps1
      - name: Package contract tests
        run: python -m unittest discover -s scripts -p test_release.py -v
