name: Native build dependencies
description: Set up the pinned Go/Zig toolchain and native libghostty-vt.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Restore pinned native dependencies
      id: native-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/tools/zig-0.16.0
          deps/libghostty-vt
        key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/GHOSTTY_PIN*', 'scripts/bootstrap_libghostty.*', '.github/actions/setup-native/action.yml') }}
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y linux-libc-dev gcc ncurses-bin ripgrep shellcheck
        if [[ ! -x "$HOME/tools/zig-0.16.0/zig" ]]; then
          archive="$RUNNER_TEMP/zig-linux.tar.xz"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --proto '=https' --proto-redir '=https' \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum --check
          mkdir -p "$HOME/tools"
          tar -xJf "$archive" -C "$HOME/tools"
          mv "$HOME/tools/zig-x86_64-linux-0.16.0" "$HOME/tools/zig-0.16.0"
        fi
        echo "$HOME/tools/zig-0.16.0" >> "$GITHUB_PATH"
    - name: Windows native dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Keep SQLite fixtures on the runner work disk and avoid TEMP's 8.3 alias.
        $testTemp = Join-Path $env:RUNNER_TEMP 'crude-tests'
        New-Item -ItemType Directory -Force $testTemp | Out-Null
        # The work disk inherits BUILTIN\Users access. These fixtures exercise
        # private receipt journals, so give their root an owner-only DACL first.
        $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
        $acl = [System.Security.AccessControl.DirectorySecurity]::new()
        $acl.SetOwner($sid)
        $acl.SetAccessRuleProtection($true, $false)
        $rule = [System.Security.AccessControl.FileSystemAccessRule]::new($sid, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
        $acl.AddAccessRule($rule)
        Set-Acl -LiteralPath $testTemp -AclObject $acl
        "TEMP=$testTemp" >> $env:GITHUB_ENV
        "TMP=$testTemp" >> $env:GITHUB_ENV
        $tools = Join-Path $HOME 'tools'
        if (-not (Test-Path (Join-Path $tools 'zig-0.16.0/zig.exe'))) {
          $archive = Join-Path $env:RUNNER_TEMP 'zig-windows.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip' -OutFile $archive -TimeoutSec 180 -MaximumRetryCount 3
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') {
            throw 'Zig archive SHA256 mismatch'
          }
          New-Item -ItemType Directory -Force $tools | Out-Null
          Expand-Archive $archive -DestinationPath $tools
          Move-Item (Join-Path $tools 'zig-x86_64-windows-0.16.0') (Join-Path $tools 'zig-0.16.0')
        }
        (Join-Path $tools 'zig-0.16.0') >> $env:GITHUB_PATH
    - name: Bootstrap Linux libghostty-vt
      if: runner.os == 'Linux'
      shell: bash
      run: ./scripts/bootstrap_libghostty.sh
    - name: Bootstrap Windows libghostty-vt
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & ./scripts/bootstrap_libghostty.ps1
        if ($LASTEXITCODE -ne 0) { throw 'libghostty-vt bootstrap failed' }
    # Save after bootstrap, so a later test failure does not discard the cache.
    - name: Save verified native dependencies
      if: steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/tools/zig-0.16.0
          deps/libghostty-vt
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
